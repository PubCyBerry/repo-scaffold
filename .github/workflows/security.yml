# 보안 게이트. 자격 증명과 의존성 취약점.
#
# 검사 셋의 역할이 다르다.
#   just security   저장소가 배포하는 의존성 0 검사기. staged 내용과 .env 키를 본다
#   gitleaks        권위 있는 자격 증명 검사기. 작업 트리가 아니라 git 이력 전체를 본다
#   osv-scanner     잠긴 의존성의 알려진 취약점
#
# gitleaks 와 osv-scanner 는 PyPI 에 없어 uv tool install 채널 밖이다. tools.txt 에 두지
# 않고 개발자 머신에도 요구하지 않는다. 릴리스 바이너리를 버전 고정으로 받아 CI 에서만 쓴다.
# 공식 액션을 쓰지 않는 이유는 gitleaks-action 이 조직 계정에 라이선스 키를 요구하기
# 때문이다. 스캐폴딩된 저장소가 조직으로 옮겨가는 순간 조용히 막힌다.
#
# 이력 전체를 보므로 checkout 에 fetch-depth: 0 이 필요하다. 얕은 클론이면 gitleaks 는
# 받아온 커밋만 보고 통과한다. 초록 불이 미검사라는 뜻이 되는 자리다.
# 기존 저장소를 옮겨 오면 옛 커밋에서 지적이 나올 수 있다. 값을 폐기하고 나서
# .gitleaks.toml 에 근거와 함께 allowlist 를 적는다. 지적을 지워서 통과시키지 않는다.
#
# 잡 이름 security 는 브랜치 룰셋의 required status check 이름이다. 룰셋은 파일명이 아니라
# 잡 이름으로 매칭한다. 바꾸면 모든 PR 이 오지 않는 검사를 영원히 기다린다.
# merge_group 트리거도 같은 이유로 필수다. 큐에서 보고하지 않는 필수 검사는 큐를 멈춘다.
#
# 액션은 40자 SHA 로 고정하고 버전은 같은 줄 뒤에 주석으로 단다. Renovate 의 actions
# 매니저는 같은 줄 트레일링 주석만 읽는다. 윗줄에 두면 그 액션은 영원히 갱신되지 않는다.
# 아래 릴리스 바이너리 버전은 renovate.json 의 custom manager 가 # renovate: 주석을 보고
# 갱신한다. 주석을 지우면 그 도구는 영원히 갱신되지 않는다.

name: Security

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    # 새 취약점은 코드를 안 고쳐도 나타난다. 주 1회 다시 본다.
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 트리거를 키에 넣는다. schedule 과 push 는 둘 다 github.ref 가 refs/heads/main 이라
  # 이름과 ref 만으로 묶으면 주간 예약 실행과 push 실행이 서로를 취소한다.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: 8.30.1
  # renovate: datasource=github-releases depName=google/osv-scanner
  OSV_SCANNER_VERSION: 2.5.0

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks 는 이력 전체를 본다. 얕은 클론이면 조용히 미검사가 된다.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install just
        run: |
          set -euo pipefail
          # 도구 버전의 단일 출처는 tools.txt 다. just 를 먼저 깔아야 just bootstrap 이 돈다.
          spec="$(awk '$1 ~ /^rust-just==/ { print $1; exit }' tools.txt)"
          if [ -z "$spec" ]; then
            echo "FAIL: tools.txt 에 rust-just 항목이 없다" >&2
            exit 1
          fi
          uv tool install "$spec"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Bootstrap
        run: |
          set -euo pipefail
          just bootstrap

      # gitleaks 를 저장소 검사보다 먼저 깐다. just security 가 부르는 check-secrets.sh 는
      # gitleaks 가 PATH 에 있으면 한 층 더 얹는다. 순서가 반대면 CI 에서 그 층이 한 번도
      # 돌지 않고, 그 사실은 초록 불과 구분되지 않는다.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Repository checks
        run: |
          set -euo pipefail
          just security

      - name: gitleaks
        run: |
          set -euo pipefail
          # --config 를 명시한다. 안 주면 .gitleaks.toml 이 사라져도 내장 기본 규칙으로
          # 조용히 떨어져 0 으로 끝난다. 명시하면 파일이 없을 때 에러로 끝난다.
          # 지적이 하나라도 있으면 1 로 끝난다. 값은 --redact 로 가린다.
          # -v 가 없으면 "leaks found: 1" 한 줄만 남아 규칙도 파일도 줄도 알 수 없다.
          gitleaks git --no-banner -v --redact --config .gitleaks.toml .

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          sudo curl -fsSL -o /usr/local/bin/osv-scanner "${base}/osv-scanner_linux_amd64"
          sudo chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: osv-scanner
        run: |
          set -euo pipefail
          # --allow-no-lockfiles 가 없으면 잠금 파일이 없는 저장소에서 128 로 끝난다.
          # 그 빨간불은 취약점이 아니라 스캔 대상이 없다는 뜻이라 아무 사실도 알려주지 않는다.
          osv-scanner scan source --recursive --allow-no-lockfiles .
