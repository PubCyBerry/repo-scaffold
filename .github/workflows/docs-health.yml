# 문서 게이트와 문서 건강 검사.
#
# 잡이 둘인 이유가 이 파일의 전부다.
#   docs            PR 필수 검사. 저장소 안에서 답이 나오는 것만 본다
#   docs-scheduled  예약 전용. 네트워크와 달력에 의존해 PR 을 막으면 안 되는 것만 본다
#
# 외부 링크는 남의 서버가 죽으면 실패하고, 검토 주기는 아무도 코드를 안 고쳐도 지난다.
# 둘 중 하나라도 PR 게이트에 넣으면 자기 변경과 무관한 이유로 머지가 막힌다.
# 그렇다고 예약 잡만 두면 룰셋이 요구하는 docs 검사가 PR 에서 보고되지 않아 큐가 멈춘다.
# 그래서 한 파일 안에서 잡을 나눈다.
#
# 잡 이름 docs 는 브랜치 룰셋의 required status check 이름이다. 룰셋은 파일명이 아니라
# 잡 이름으로 매칭한다. 바꾸면 모든 PR 이 오지 않는 검사를 영원히 기다린다.
# merge_group 트리거도 같은 이유로 필수다. 큐에서 보고하지 않는 필수 검사는 큐를 멈춘다.
#
# 액션은 40자 SHA 로 고정하고 버전은 같은 줄 뒤에 주석으로 단다. Renovate 의 actions
# 매니저는 같은 줄 트레일링 주석만 읽는다. 윗줄에 두면 그 액션은 영원히 갱신되지 않는다.
# 아래 릴리스 바이너리 버전은 renovate.json 의 custom manager 가 # renovate: 주석을 보고
# 갱신한다. 주석을 지우면 그 도구는 영원히 갱신되지 않는다.

name: Docs

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    # 문서는 아무도 안 고쳐도 낡는다. 주 1회 다시 본다.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 트리거를 키에 넣는다. schedule 과 push 는 둘 다 github.ref 가 refs/heads/main 이라
  # 이름과 ref 만으로 묶으면 주간 예약 실행과 push 실행이 서로를 취소한다.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=lycheeverse/lychee
  LYCHEE_VERSION: 0.24.2

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # source drift 는 sources 경로의 마지막 변경을 git 이력에서 찾는다.
          # 얕은 클론이면 받아온 커밋 하나만 보여서 답이 틀린다.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install just
        run: |
          set -euo pipefail
          # 도구 버전의 단일 출처는 tools.txt 다. just 를 먼저 깔아야 just bootstrap 이 돈다.
          spec="$(awk '$1 ~ /^rust-just==/ { print $1; exit }' tools.txt)"
          if [ -z "$spec" ]; then
            echo "FAIL: tools.txt 에 rust-just 항목이 없다" >&2
            exit 1
          fi
          uv tool install "$spec"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Bootstrap
        run: |
          set -euo pipefail
          just bootstrap

      - name: Document rules
        run: |
          set -euo pipefail
          just docs

      - name: Markdown structure and links
        run: |
          set -euo pipefail
          just markdown

  docs-scheduled:
    name: docs-scheduled
    # PR 과 merge queue 에서는 돌지 않는다. 필수 검사는 위의 docs 잡이다.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install just
        run: |
          set -euo pipefail
          # 도구 버전의 단일 출처는 tools.txt 다. just 를 먼저 깔아야 just bootstrap 이 돈다.
          spec="$(awk '$1 ~ /^rust-just==/ { print $1; exit }' tools.txt)"
          if [ -z "$spec" ]; then
            echo "FAIL: tools.txt 에 rust-just 항목이 없다" >&2
            exit 1
          fi
          uv tool install "$spec"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Bootstrap
        run: |
          set -euo pipefail
          just bootstrap

      - name: Install lychee
        run: |
          set -euo pipefail
          # PyPI 에 없어 uv tool install 채널 밖이다. 개발자 머신에 요구하지 않고
          # 릴리스 바이너리를 버전 고정으로 받아 CI 에서만 쓴다.
          target="lychee-x86_64-unknown-linux-gnu"
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          curl -fsSL "${base}/${target}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "${target}/lychee"
          lychee --version

      - name: Document health
        run: |
          set -euo pipefail
          just docs-health
