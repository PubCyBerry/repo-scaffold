# SPDX-License-Identifier: MIT
#
# Gate every PR on the skill contract and on the scaffold's smoke test.
# The contract check is the catalog's own validator: a skill that fails it would
# be dropped by the catalog sync anyway. yq, jq, and shellcheck ship with the
# ubuntu runner image, so nothing is installed.
#
# The smoke test runs on three platforms because the scaffold promises bash and
# git only: GNU tools on ubuntu, BSD tools on macOS, and Git Bash on Windows.

name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skill contract
        run: bash .github/scripts/validate-skills.sh
      - name: Shellcheck
        run: |
          shellcheck \
            skills/repo-scaffold/assets/scaffold.sh \
            skills/repo-scaffold/assets/scripts/doc-index.sh \
            skills/repo-scaffold/assets/githooks/pre-commit \
            skills/repo-scaffold/tests/smoke.sh
      - name: Template indexes are current
        run: bash skills/repo-scaffold/assets/scripts/doc-index.sh --check

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Smoke test
        run: bash skills/repo-scaffold/tests/smoke.sh
