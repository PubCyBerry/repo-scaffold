# 같은 것을 두 이름으로 부르면 검색이 갈라진다. 큐레이션 블랙리스트다.
# 팀에서 쓰는 말이 정해질 때마다 한 줄씩 늘린다. 일반 규칙을 발명하지 않는다.
#
# nonword 없이는 아무것도 잡지 못한다. Vale 의 기본 낱말 경계 \b 는 ASCII 전용이라
# '저장소를' 처럼 조사가 붙은 형태에서 발화하지 않고, 그러면 초록 불이 곧 미검사다.
#
# message 의 %s 순서는 직관과 반대다. 첫째가 바꿔 넣을 말, 둘째가 발견된 말이다.
extends: substitution
message: "'%s' 를 쓴다. '%s' 가 아니다"
level: error
nonword: true
link: docs/standards/writing-style.md
swap:
  '레포지토리|리포지토리|레포': 저장소
  '커밋메시지': 커밋 메시지
  '풀리퀘스트': 풀 리퀘스트
  '컨플릭트': 충돌
  '롤백하다': 되돌리다
