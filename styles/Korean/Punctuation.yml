# 전각 문장부호와 부호 앞 공백. 둘 다 정규식으로 판정이 끝나는 것들이다.
#
# 전각 부호는 폭이 달라 표가 어긋나고, 검색어와도 맞지 않는다.
# 부호 앞 공백은 한국어 조판에서 쓰지 않는다.
#
# raw 를 쓰므로 낱말 경계가 끼어들지 않는다. 말줄임표는 뒤에 점이 이어져 걸리지 않는다.
#
# raw 목록은 Vale 이 그대로 이어 붙인다. 대안은 한 줄 안에 | 로 묶는다.
extends: existence
message: "문장부호 표기를 고친다: '%s'"
level: error
link: docs/standards/writing-style.md
raw:
  - '([，。？！：；]|\s[,.](\s|$))'
