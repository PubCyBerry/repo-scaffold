# 외래어 표기법. 표기가 갈리면 같은 낱말을 검색으로 못 찾는다.
# 표기가 하나로 정해진 것만 싣는다. 논쟁이 있는 것은 싣지 않는다.
extends: substitution
message: "'%s' 를 쓴다. '%s' 가 아니다"
level: error
nonword: true
link: docs/standards/writing-style.md
swap:
  '디렉토리': 디렉터리
  '컨텐츠': 콘텐츠
  '메세지': 메시지
  '어플리케이션': 애플리케이션
  '데이타': 데이터
  '스케쥴': 스케줄
  '윈도우즈': 윈도
  '브라우져': 브라우저
  '플래폼|플렛폼': 플랫폼
