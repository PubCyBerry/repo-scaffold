# 외부 URL 검사 규칙. 검사기는 lychee 다. https://lychee.cli.rs
#
# 검사:  just links-external      네트워크를 탄다. 훅에는 없다
#
# lychee 는 CI 전용 도구다. tools.txt 에 없고 uv 로 깔리지 않는다. PyPI 밖 도구이고
# 네트워크가 필요해서 개발자 머신에 요구하지 않는다. 없으면
# tests/check-links-external.sh 가 로컬 SKIP, CI FAIL 로 처리한다.
# 이 파일을 그래도 저장소에 두는 것은 CI 와 어쩌다 깔려 있는 개발자 머신이 같은 규칙을
# 쓰게 하기 위해서다.
#
# 저장소 안 링크는 여기서 보지 않는다. tests/check-docs.sh 와 rumdl 이 본다.
# 대상 파일 목록도 여기서 정하지 않는다. 스크립트가 git ls-files 로 넘긴다.

# 진행 표시는 CI 로그를 채우기만 한다.
no_progress = true

# 결과를 캐시해 예약 검사가 매번 전체를 다시 두드리지 않게 한다.
# 캐시 파일은 .lycheecache 이고 .gitignore 대상이다.
cache = true
max_cache_age = "2d"

# 5xx 는 캐시하지 않는다. 서버 일시 장애를 이틀 동안 실패로 기억하면 안 된다.
cache_exclude_status = "500.."

# 동시 요청 수를 기본값보다 낮춘다. 한 호스트를 몰아치면 429 를 받는다.
max_concurrency = 8
max_retries = 2
retry_wait_time = 2
timeout = 20

# 429 는 링크가 깨진 것이 아니라 우리가 빠른 것이다. 실패로 세지 않는다.
accept = ["200..=299", "429"]

# 사설 주소, 링크 로컬, localhost 는 CI 에서 닿지 않는다. 깨진 링크가 아니다.
exclude_all_private = true

# 검사에서 빼는 URL. 빼는 이유를 줄마다 적는다. 근거 없는 제외는 검사를 지우는 것과 같다.
exclude = [
    # 규격상 존재하지 않는 예시 도메인
    '^https?://(www\.)?example\.(com|org|net)',
    '^https?://[^/]+\.(invalid|test|example)(/|$)',
    # 로그인해야 보이는 곳. 익명 요청에는 링크 상태와 무관하게 실패나 리다이렉트로 답한다
    '^https?://(www\.)?linkedin\.com',
    '^https?://([a-z0-9-]+\.)?(x|twitter)\.com',
]

# 검사에서 빼는 경로. 생성물과 의존성 안의 남의 문서는 우리 책임이 아니다.
exclude_path = [
    "node_modules",
    ".venv",
    "docs/generated",
]
