# pre-commit 설정. 실행기는 prek 다. https://prek.j178.dev
#
# 설치:  just bootstrap       훅 세 종류를 한 번에 깐다
# 수동:  just check           prek run --all-files
# 빠름:  just check-fast      slow 그룹을 뺀다
# 건너뛰기: git commit --no-verify
#
# 외부 저장소를 받지 않는다. 전부 repo: local 이라 커밋마다 clone 이 필요 없고,
# 실제로 도는 코드가 저장소 안에 있어 리뷰와 버전 고정을 받는다.
#
# 훅은 tests/*.sh 와 scripts/*.sh 를 직접 부른다. Justfile 을 거치지 않는다.
# 거치면 prek 가 just 를 부르고 just 가 다시 prek 를 부르는 순환이 된다.
# tests/check-hooks.sh 가 그 규약과 아래 stage 선언을 기계로 검사한다.
#
# 도구가 없으면 스크립트가 로컬 SKIP, CI FAIL 로 처리한다.
# 로컬에서 커밋을 막으면 --no-verify 가 습관이 되므로 막지 않고 CI 에서 잡는다.
#
# 아직 도입하지 않은 훅은 주석으로 남겼다. 도입할 때 주석만 벗긴다.

# 이 줄이 없으면 prek install 이 pre-commit 만 깔고 commit-msg 와 pre-push 훅은
# 한 번도 돌지 않는다. 가장 조용한 실패 지점이다.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# stages 를 적지 않은 훅은 pre-commit 에서만 돈다.
# 이 줄이 없으면 모든 훅이 세 스테이지에서 전부 돈다.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # --- pre-commit: 파일 단위로 빠르게 끝나는 검사 ----------------------
      - id: doc-index
        name: AGENTS.md 문서 인덱스 갱신
        entry: bash scripts/gen-doc-index.sh --stage
        language: system
        files: \.(md|mdx)$
        pass_filenames: false
        groups: [fast, docs]
        description: >
          저장소의 .md/.mdx 목록을 디렉터리별로 묶어 AGENTS.md 마커 사이에 넣는다.
          내용이 바뀌면 AGENTS.md 를 스테이징하고 실패로 끝낸다. 커밋을 다시 실행한다.

      - id: doc-rules
        name: 문서 규약 검증
        entry: bash tests/check-docs.sh --only title,placement,paths
        language: system
        files: \.(md|mdx)$
        pass_filenames: false
        groups: [fast, docs]
        description: >
          title 과 본문 H1 일치, 파일 위치와 type 일치, 백틱 경로 표기를 확인한다.
          front matter 의 값 계약은 docs-metadata 가 보고 링크는 markdown 이 본다.
          여기는 두 세계를 잇는 규칙만 본다.

      - id: docs-metadata
        name: front matter 스키마 검증
        entry: bash tests/check-docs-metadata.sh --only schema
        language: system
        files: \.(md|mdx)$
        pass_filenames: false
        groups: [docs, config]
        description: >
          front matter 를 저장소 밖 임시 디렉터리에 YAML 로 떼어내
          schemas/docs-frontmatter.schema.json 과 대조한다. check-jsonschema 에는 front
          matter 리더가 없어서 떼어내는 단계가 필요하다. 키 이름 오타처럼 doc-rules 가
          못 잡는 것을 잡는다. 그래프와 수명주기는 pre-push 와 just verify 가 본다.

      - id: markdown
        name: 마크다운 검사
        entry: bash tests/check-markdown.sh
        language: system
        files: \.(md|mdx)$
        pass_filenames: false
        groups: [docs]
        description: >
          rumdl 로 구조와 형식을 본다. 규칙은 .rumdl.toml 이다. 파일을 바꾸지 않는다.
          바뀐 파일만 넘기지 않고 저장소 전체를 본다. cross-file 앵커 검사가 색인을
          필요로 해서, 파일 하나만 넘기면 조용히 미검사가 된다.

      - id: prose
        name: 산문 검사
        entry: bash tests/check-prose.sh
        language: system
        files: \.(md|mdx)$
        pass_filenames: false
        groups: [docs]
        description: >
          Vale 로 산문, 용어, 문자 규칙을 본다. 규칙은 .vale.ini 와 styles/ 다.
          error 만 실패로 친다. warning 은 보고만 한다. Vale 은 첫 실행에 네트워크가
          필요하므로 없으면 로컬 SKIP, CI FAIL 이다.

      - id: python-format
        name: 파이썬 형식 검사
        entry: bash tests/check-python.sh --only format
        language: system
        files: \.pyi?$
        pass_filenames: false
        groups: [code, python]
        description: >
          ruff format --check 로 형식이 어긋난 파일만 알린다. 파일을 고치지 않는다.
          훅이 커밋 도중에 파일을 다시 쓰면 커밋한 내용과 검사한 내용이 갈린다.
          고치는 것은 just fmt 다. 형식 기준은 pyproject.toml 에 있다.

      - id: python-lint
        name: 파이썬 정적 분석
        entry: bash tests/check-python.sh --only lint
        language: system
        files: \.pyi?$
        pass_filenames: false
        groups: [code, python]
        description: >
          ruff check 로 정적 분석한다. 규칙은 pyproject.toml 이 갖고 있고 그 근거는
          docs/standards/code-quality.md 다. 자동으로 고칠 수 있는 지적은 just fix 로 고친다.

      - id: shell-lint
        name: 셸 스크립트 검사
        entry: bash tests/check-shell.sh
        language: system
        files: \.(sh|bash)$
        pass_filenames: false
        groups: [code, shell]
        description: >
          shellcheck 로 정적 분석하고 shfmt 로 형식을 본다. 형식 기준은 .editorconfig 다.
          shfmt 에 형식 플래그를 주면 .editorconfig 가 무시되므로 주지 않는다.

      - id: yaml-lint
        name: YAML 과 선언 설정 검사
        entry: bash tests/check-yaml.sh
        language: system
        files: (\.(yml|yaml)$|(^|/)renovate\.json$|(^|/)\.renovaterc\.json$)
        pass_filenames: false
        groups: [config]
        description: >
          yamllint 으로 YAML 문법과 형식을 보고, 워크플로는 내장 GitHub Actions
          스키마로, renovate.json 은 내장 Renovate 스키마로 키 구조까지 본다.
          형식 기준은 .yamllint.yaml 이고 경고도 실패다. renovate.json 은 YAML 이
          아니지만 검사기가 같고, 어긋나면 의존성 갱신 PR 이 조용히 0건이 된다.

      - id: workflow-lint
        name: GitHub Actions 워크플로 검사
        entry: bash tests/check-workflows.sh
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$
        pass_filenames: false
        groups: [config, security]
        description: >
          actionlint 로 문법과 step 안 셸을 보고, zizmor 로 자격 증명 잔류, 주입,
          미고정 action 을 감사한다. 토큰이 없으면 zizmor 는 --offline 으로 돈다.
          워크플로를 고칠 때만 돈다. 전체 재검사는 pre-push 의 workflow-lint-push 다.

      - id: hook-config
        name: 훅 설정 규약 검증
        entry: bash tests/check-hooks.sh
        language: system
        files: ^(\.pre-commit-config\.yaml|Justfile|(tests|scripts)/.*\.sh)$
        pass_filenames: false
        groups: [fast, config]
        description: >
          훅 entry 가 just 를 부르지 않는지, 쓰인 stage 가 default_install_hook_types
          안에 있는지, entry 가 부르는 스크립트가 실재하는지 확인한다.


      - id: tool-versions
        name: 도구 버전 선언 대조
        entry: bash tests/check-tool-versions.sh
        language: system
        files: ^(tools\.txt|pyproject\.toml|\.github/workflows/.*\.(yml|yaml))$
        pass_filenames: false
        groups: [fast, config]
        description: >
          워크플로 env 의 <NAME>_VERSION 이 tools.txt 와 pyproject.toml 의 선언과 같은지 본다.
          같은 도구 버전이 여러 파일에 적혀 있고, 한 곳만 갱신되면 CI 와 개발자 머신이 다른
          버전으로 돌면서 검사는 초록 불이다.
      - id: env-sync
        name: .env 키 동기화 검증
        entry: bash tests/check-env.sh
        language: system
        always_run: true
        pass_filenames: false
        groups: [fast, security]
        description: >
          *.env.example 과 같은 디렉터리 .env 의 키 집합이 같은지, .env.example 의 비밀 키가
          비어 있는지 확인한다. .env 는 gitignore 대상이라 변경을 훅이 볼 수 없으므로
          files 로 거르지 않고 매 커밋 돈다. .env 가 없으면 SKIP 이다.

      - id: secret-scan
        name: 자격 증명 스캔
        entry: bash tests/check-secrets.sh
        language: system
        always_run: true
        pass_filenames: false
        groups: [fast, security]
        description: >
          staged 내용에서 토큰, 키, 사설키 블록 패턴을 찾는다. 값은 출력하지 않고
          파일명과 줄 번호만 보고한다. 오탐이면 그 줄에 secret-scan: allow 주석을 붙인다.

      # --- commit-msg: 커밋 메시지 --------------------------------------------
      - id: commitlint
        name: 커밋 메시지 규약 검증
        entry: bash tests/check-commit-msg.sh
        language: system
        stages: [commit-msg]
        groups: [commit]
        description: >
          Conventional Commits 형식과 제목의 금지 문자를 본다. 형식은 commitlint 가 보고
          node_modules 가 없으면 그 단계만 로컬 SKIP, CI FAIL 이다. 표기 검사는 도구를
          쓰지 않으므로 node_modules 가 없어도 돈다. 메시지 파일 경로는 훅이 넘긴다.

      # --- pre-push: 저장소 전체를 봐야 하는 검사 -----------------------------
      # 부분 검사가 틀린 답을 내는 것들이다. 느려서 미룬 것이 아니다.
      - id: docs-graph
        name: 문서 그래프 검증
        entry: bash tests/check-docs-metadata.sh --only graph
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        groups: [docs, slow]
        description: >
          id 중복과 형식, related 와 supersedes 대상, 대체 관계의 순환, sources 경로,
          도달 가능성을 본다. 문서 하나만 봐서는 알 수 없고 저장소 전체를 봐야 하므로
          pre-push 다.

      - id: workflow-lint-push
        name: GitHub Actions 워크플로 전체 검사
        entry: bash tests/check-workflows.sh --only actionlint
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        groups: [config, slow]
        description: >
          워크플로 파일을 안 고쳐도 워크플로는 깨진다. run: 이 부르는 스크립트나
          로컬 액션이 바뀌면 pre-commit 의 파일 필터에 걸리지 않는다. push 전에
          저장소 전체 워크플로를 다시 본다. zizmor 는 pre-commit 과 CI 에서만 돈다.

      - id: mypy
        name: 타입 검사
        entry: bash tests/check-python.sh --only type
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        groups: [code, python, slow]
        description: >
          mypy 는 고친 파일만 봐서는 답이 안 나온다. 타입 변경은 그 파일을 부르는
          쪽에서 터지므로 저장소 전체를 봐야 한다. 느려서가 아니라 부분 검사가
          틀린 답을 내서 pre-push 다. 파이썬 파일이 없으면 SKIP 이다.

      - id: unit-test
        name: 단위 테스트
        entry: bash tests/run-tests.sh --only unit
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        groups: [test, slow]
        description: >
          tests/unit 만 돌린다. 경계를 넘는 갈래는 CI 가 맡는다.
          디렉터리가 없거나 수집할 테스트가 없으면 SKIP 이다.

      - id: source-drift
        name: 문서 source drift 검사
        entry: bash tests/check-docs-metadata.sh --only drift
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        groups: [docs, slow]
        description: >
          front matter 의 sources 에 적힌 경로가 last_reviewed 이후에 바뀌었는지 git
          이력으로 본다. 문서 하나만 봐서는 알 수 없고 저장소 이력을 봐야 하므로 pre-push 다.
          시간이 흘러 낡은 것(stale-by-time)은 여기서 보지 않는다. 그것으로 푸시를 막으면
          문서와 무관한 작업이 달력 때문에 멈춘다. 예약 CI 가 본다.
