# pre-commit 설정. 실행기는 prek 다. https://prek.j178.dev
#
# 설치:  just bootstrap       훅 세 종류를 한 번에 깐다
# 수동:  just check           prek run --all-files
# 빠름:  just check-fast      slow 그룹을 뺀다
# 건너뛰기: git commit --no-verify
#
# 외부 저장소를 받지 않는다. 전부 repo: local 이라 폐쇄망에서 clone 실패로 막히지 않는다.
#
# 훅은 tests/*.sh 와 scripts/*.sh 를 직접 부른다. Justfile 을 거치지 않는다.
# 거치면 prek 가 just 를 부르고 just 가 다시 prek 를 부르는 순환이 된다.
# tests/check-hooks.sh 가 그 규약과 아래 stage 선언을 기계로 검사한다.
#
# 도구가 없으면 스크립트가 로컬 SKIP, CI FAIL 로 처리한다.
# 로컬에서 커밋을 막으면 --no-verify 가 습관이 되므로 막지 않고 CI 에서 잡는다.
#
# 아직 도입하지 않은 훅은 주석으로 남겼다. 도입할 때 주석만 벗긴다.

# 이 줄이 없으면 prek install 이 pre-commit 만 깔고 commit-msg 와 pre-push 훅은
# 한 번도 돌지 않는다. 가장 조용한 실패 지점이다.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# stages 를 적지 않은 훅은 pre-commit 에서만 돈다.
# 이 줄이 없으면 모든 훅이 세 스테이지에서 전부 돈다.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # --- pre-commit: 파일 단위로 빠르게 끝나는 검사 ----------------------
      - id: doc-index
        name: AGENTS.md 문서 인덱스 갱신
        entry: bash scripts/gen-doc-index.sh --stage
        language: system
        files: \.(md|mdx)$
        pass_filenames: false
        groups: [fast, docs]
        description: >
          저장소의 .md/.mdx 목록을 디렉터리별로 묶어 AGENTS.md 마커 사이에 넣는다.
          내용이 바뀌면 AGENTS.md 를 스테이징하고 실패로 끝낸다. 커밋을 다시 실행한다.

      - id: doc-rules
        name: 문서 규약 검증
        entry: bash tests/check-docs.sh --only frontmatter,paths
        language: system
        files: \.(md|mdx)$
        pass_filenames: false
        groups: [fast, docs]
        description: >
          front matter 필수 property, type 과 위치 일치, status, 백틱 경로 표기를 확인한다.

      - id: doc-links
        name: 문서 링크 대상 확인
        entry: bash tests/check-docs.sh --only links
        language: system
        files: \.(md|mdx)$
        pass_filenames: false
        groups: [fast, docs]
        description: >
          마크다운 링크 대상이 실재하는지 확인한다. docs/ 밖 문서를 고쳐도 링크가
          깨질 수 있으므로 모든 마크다운 변경에 돈다. 외부 URL 은 보지 않는다.

      # PR5: front matter JSON Schema 검증
      # - id: docs-metadata
      #   name: front matter 스키마 검증
      #   entry: bash tests/check-docs-metadata.sh
      #   language: system
