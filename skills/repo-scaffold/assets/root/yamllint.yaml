# yamllint 설정. tests/check-yaml.sh 와 yaml-lint 훅이 이 파일을 기준으로 돈다.
#
# 소유 범위를 나눈다. YAML 문법과 형식은 yamllint 이 보고, GitHub Actions 의 의미는
# actionlint 이, 보안은 zizmor 가 본다. 워크플로 도구는 tests/check-workflows.sh 에 있다.
# 같은 규칙을 두 도구에 두지 않는다. 갈리면 어느 쪽이 맞는지 알 수 없다.
#
# 기본 프로파일에서 값을 바꾼 규칙만 아래에 적는다. 새 규칙을 발명하지 않는다.
# 경고도 실패다. tests/check-yaml.sh 가 --strict 로 부른다.
# 근거는 docs/standards/code-quality.md 의 zero warnings 다.

extends: default

rules:
  # 줄 길이는 이 저장소 표준인 100 이다. .editorconfig 와 code-quality.md 가 같은 값을 쓴다.
  # yamllint 기본값 80 은 이 저장소 기준이 아니다.
  line-length:
    max: 100

  # .editorconfig 의 [*.{yml,yaml,json}] indent_size = 2 와 같은 값이다.
  # 두 파일이 갈리면 편집기와 훅이 서로를 되돌린다.
  indentation:
    spaces: 2

  # 문서 시작 표시를 요구하지 않는다. GitHub Actions 워크플로도 .pre-commit-config.yaml 도
  # 관용적으로 --- 를 쓰지 않는다. 요구하면 첫 줄부터 전부 걸린다.
  document-start: disable

  # 키 이름은 truthy 검사에서 뺀다. GitHub Actions 의 on: 이 YAML 1.1 에서 참 값이라
  # 켜두면 모든 워크플로가 트리거 선언에서 걸린다. 값 쪽 검사는 그대로 둔다.
  truthy:
    check-keys: false
