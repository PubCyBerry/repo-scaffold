# 마크다운 구조와 형식 규칙. 검사기는 rumdl 이다. https://rumdl.dev
#
# 검사:  just markdown       rumdl check. 파일을 바꾸지 않는다
# 수정:  just fmt            rumdl fmt. 파일을 바꾼다
#
# 훅은 check 만 부른다. 훅이 파일을 바꾸면 커밋 대상이 사람이 본 것과 달라진다.
#
# 문자 규칙(따옴표, 대시, 보이지 않는 문자)은 Vale 이 갖는다. MD088 과 MD084 는 켜지 않는다.
# 한 규칙을 두 도구에 두면 어느 쪽을 고쳐야 하는지 알 수 없다.
# 사람이 읽는 원본은 docs/standards/documentation.md 와 docs/standards/writing-style.md 다.

[global]
# .editorconfig 와 docs/standards/code-quality.md 가 둘 다 100 이다. 기본값 80 이 아니다.
line-length = 100
respect-gitignore = true

# CLAUDE.md 는 문서가 아니라 AGENTS.md 를 가리키는 한 줄 import 포인터다.
# 첫 줄이 H1 이어야 한다는 MD041 을 만족시킬 수 없고 만족시킬 이유도 없다.
#
# .github/pull_request_template.md 도 문서가 아니다. GitHub 이 PR 본문에 그대로 붙이는
# 서식이라 최상위 제목을 둘 수 없다. 두면 모든 PR 본문이 H1 으로 시작한다.
# 절 제목은 pr-policy 워크플로가 글자 단위로 검사하므로 구조는 이미 고정돼 있다.
exclude = ["CLAUDE.md", ".github/pull_request_template.md"]

[MD013]
# 표는 줄 안에서 접을 수 없다. URL 도 마찬가지다.
tables = false
code-blocks = false

[MD025]
# front matter 의 title 을 최상위 제목으로 세지 않는다.
# 이 저장소는 title 과 본문 H1 이 같아야 하므로, 세면 모든 문서가 제목 두 개로 걸린다.
front-matter-title = ""

[MD057]
# 링크 대상이 실재하는지 보는 규칙의 주인은 여기다. 기본 활성이고, 링크가 적힌 문서의
# 디렉터리를 기준으로 경로를 푼다. 이 저장소의 "문서 기준 상대 경로" 규약과 같다.
# 마크다운이 아닌 대상(Justfile, *.sh)도 존재를 본다. 실측으로 확인했다.
#
# absolute-links 기본값은 ignore 다. 켜지 않으면 [문서](/docs/foo.md) 가 조용히 통과한다.
# warn 도 종료 코드 1 을 낸다. --fail-on 을 주지 않는 한 실질은 error 와 같다.
absolute-links = "warn"

# search-paths 는 설정하지 않는다. 설정하면 문서 기준으로 존재하지 않는 링크를 다른
# 위치에서 찾아 성공시켜서 규약이 느슨해진다.
#
# check-frontmatter 도 켜지 않는다. front matter 의 경로 값은 scripts/docs_graph.py 의
# sources 단계가 주인이다. 켜면 한 규칙에 주인이 둘이 된다.

[MD051]
# 한글 제목의 앵커를 살린다. python-markdown 과 kramdown 스타일은 ASCII 전용이라
# '## 코드 품질' 같은 제목이 빈 앵커가 되어 앵커 검사가 조용히 무력해진다.
anchor-style = "github"
