# 군더더기 판정은 일반화되지 않는다. 뜻이 겹치는 고정 연어와, 정보를 담지 않는
# 완충어만 큐레이션해 싣는다. 완충어는 docs/standards/writing-style.md 의 Tone 절에서 온다.
#
# 등급이 warning 인 이유는 셋 다 문맥에 따라 정당한 쓰임이 있기 때문이다.
# 판단은 사람이 한다. 커밋을 막지 않는다.
extends: existence
message: "빼도 뜻이 같은지 본다: '%s'"
level: warning
nonword: true
link: docs/standards/writing-style.md
tokens:
  - 기본적으로
  - 단순히
  - 미리 예약
  - 다시 재시작
  - 계속 지속
  - 서로 상호
  - 다시 재현
