# 한국어 띄어쓰기 일반 규칙은 형태소 분석이 필요하고 정규식으로 표현되지 않는다.
# '그중'과 '그 중', '안된다'와 '안 된다', '한번'과 '한 번' 은 문맥에 따라 넷 다 맞기도 틀리기도 한다.
# 그래서 붙여 쓰면 언제나 틀리는 것만 큐레이션해 싣고, 등급은 warning 이다.
#
# 오탐이 나는 훅은 --no-verify 를 습관으로 만들고, 그러면 훅 전체가 함께 죽는다.
extends: substitution
message: "'%s' 로 띄어 쓴다. '%s' 가 아니다"
level: warning
nonword: true
link: docs/standards/writing-style.md
swap:
  '할수': 할 수
  '될수': 될 수
  '수있': 수 있
  '수없': 수 없
  '것같': 것 같
  '해야한다': 해야 한다
  '하지않는다': 하지 않는다
  '할것이다': 할 것이다
