# 테스트 게이트.
#
# pre-push 훅은 tests/unit 만 돌린다. 경계를 넘는 갈래는 여기가 맡는다.
# just test 가 unit, integration, e2e 를 전부 돌리고 없는 갈래는 SKIP 한다.
#
# 잡 이름 tests 는 브랜치 룰셋의 required status check 이름이다. 파일명은 test.yml 이지만
# 룰셋은 파일명이 아니라 잡 이름으로 매칭하므로 둘이 달라도 된다. 잡 이름을 바꾸면
# 모든 PR 이 오지 않는 검사를 영원히 기다린다.
# merge_group 트리거도 같은 이유로 필수다. 큐에서 보고하지 않는 필수 검사는 큐를 멈춘다.
#
# 액션은 40자 SHA 로 고정하고 버전은 같은 줄 뒤에 주석으로 단다. Renovate 의 actions
# 매니저는 같은 줄 트레일링 주석만 읽는다. 윗줄에 두면 그 액션은 영원히 갱신되지 않는다.

name: Test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install just
        run: |
          set -euo pipefail
          # 도구 버전의 단일 출처는 tools.txt 다. just 를 먼저 깔아야 just bootstrap 이 돈다.
          spec="$(awk '$1 ~ /^rust-just==/ { print $1; exit }' tools.txt)"
          if [ -z "$spec" ]; then
            echo "FAIL: tools.txt 에 rust-just 항목이 없다" >&2
            exit 1
          fi
          uv tool install "$spec"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Bootstrap
        run: |
          set -euo pipefail
          # 테스트 실행기는 uv sync 가 pyproject.toml 의 dev 그룹에서 깐다.
          just bootstrap

      - name: Tests
        run: |
          set -euo pipefail
          just test
