# 코드 품질 게이트.
#
# 훅을 신뢰하지 않고 CI 가 독립으로 다시 돌린다. --no-verify 로 넘어간 커밋이 여기서 걸린다.
# just check 는 pre-commit 스테이지 훅 전체이고, just type 은 pre-push 스테이지의 mypy 다.
# prek run 은 pre-commit 스테이지만 돌리므로 타입 검사를 따로 부른다.
#
# 커밋 메시지도 같은 이유로 여기서 다시 본다. prek run 은 commit-msg 스테이지 훅을 돌리지
# 않고, node_modules 가 없는 클론에서는 그 훅이 로컬 SKIP 이다. 두 구멍이 겹치면 브랜치
# 커밋 메시지를 검사하는 게이트가 어디에도 없게 된다. checkout 의 fetch-depth: 0 이
# 그 검사의 전제다. 얕은 클론이면 base..head 를 계산할 수 없다.
#
# 잡 이름 quality 는 브랜치 룰셋의 required status check 이름이다. 룰셋은 파일명이 아니라
# 잡 이름으로 매칭한다. 바꾸면 모든 PR 이 오지 않는 검사를 영원히 기다린다.
# merge_group 트리거도 같은 이유로 필수다. 큐에서 보고하지 않는 필수 검사는 큐를 멈춘다.
#
# ruff 와 mypy 를 여기서 깐다. 문서 검사기가 파이썬 파일이라 파이썬을 쓰지 않는 저장소에도
# 추적 중인 .py 가 있고, tests/check-python.sh 는 CI 에서 도구가 없으면 FAIL 이다.
# pyproject.toml 이 있는 저장소는 uv sync 가 잠근 버전을 쓰므로 아래 버전은 쓰이지 않는다.
#
# 액션은 40자 SHA 로 고정하고 버전은 같은 줄 뒤에 주석으로 단다. Renovate 의 actions
# 매니저는 같은 줄 트레일링 주석만 읽는다. 윗줄에 두면 그 액션은 영원히 갱신되지 않는다.

name: Quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=ruff
  RUFF_VERSION: 0.16.3
  # renovate: datasource=pypi depName=mypy
  MYPY_VERSION: 2.3.1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 커밋 메시지 검사는 base..head 를 걷는다. 얕은 클론이면 범위가 비어서
          # 아무것도 검사하지 않고 초록 불이 된다.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install just
        run: |
          set -euo pipefail
          # 도구 버전의 단일 출처는 tools.txt 다. just 를 먼저 깔아야 just bootstrap 이 돈다.
          spec="$(awk '$1 ~ /^rust-just==/ { print $1; exit }' tools.txt)"
          if [ -z "$spec" ]; then
            echo "FAIL: tools.txt 에 rust-just 항목이 없다" >&2
            exit 1
          fi
          uv tool install "$spec"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Bootstrap
        run: |
          set -euo pipefail
          just bootstrap

      - name: Install Python tools
        run: |
          set -euo pipefail
          uv tool install "ruff==${RUFF_VERSION}"
          uv tool install "mypy==${MYPY_VERSION}"

      - name: Hooks
        run: |
          set -euo pipefail
          just check

      - name: Types
        run: |
          set -euo pipefail
          just type

      - name: Commit messages
        # PR 에만 있다. push 와 merge_group 에는 검사할 브랜치 범위가 없다.
        if: github.event_name == 'pull_request'
        env:
          # 리비전은 run: 에 직접 보간하지 않는다. 값은 env 로 넘긴다.
          # base.sha 가 아니라 base.ref 다. base.sha 는 PR 이벤트 시점의 대상 브랜치
          # 끝이라 그 뒤로 대상 브랜치가 나아가면 이미 머지된 남의 커밋이 범위에 들어온다.
          # 그러면 내 PR 이 남의 옛 커밋 제목 때문에 빨간불이 된다.
          # origin/<base> 는 지금의 대상 브랜치를 가리킨다. fetch-depth: 0 이 그것을 받아온다.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          just commit-range "origin/${BASE_REF}..HEAD"
