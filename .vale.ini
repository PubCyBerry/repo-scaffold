# 산문, 용어, 문자 규칙. 검사기는 Vale 이다. https://vale.sh
#
# 검사:  just prose
#
# Vale 의 자리는 셋 중 하나다.
#   - 산문 정책 검사기: docs/standards/writing-style.md 에 적힌 결정적 규칙만 기계화한다
#   - 용어 검사기: styles/Korean/ 의 큐레이션 블랙리스트
# 문법 검사기도, 글 품질 평가기도, 맞춤법 검사기도 아니다.
# 한국어 맞춤법은 Vale 로 불가능하다. 근거는 docs/references 가 아니라 README 의 도구 절에 적는다.
#
# 스타일 디렉터리는 셋이다.
#   styles/Project/   문자와 표기. 정규식이 raw 라 언어와 무관하게 동작한다
#   styles/English/   영어 낱말 규칙. docs/ 전용
#   styles/Korean/    한국어 낱말과 문체 규칙. 저장소 루트 문서 전용
#
# 영어 규칙을 한국어 문서에 걸지 않는다. 이 저장소의 명령 실행기 이름이 just 이고
# just 는 영어 완충어 목록에 들어 있어, 한 곳에 몰면 매 커밋 오탐이 난다.
#
# MinAlertLevel 이 warning 이면 warning 도 출력에 나온다. Vale 의 종료 코드는 error 에만 반응하므로
# warning 은 보고만 하고 커밋을 막지 않는다. 실측으로 확인했다.
# 오탐이 나는 훅은 --no-verify 를 습관으로 만들고, 그러면 모든 훅이 함께 죽는다.

StylesPath = styles
MinAlertLevel = warning

# 코드 스팬과 코드 블록은 검사하지 않는다. 명령과 출력은 원문 그대로 싣는 것이 규약이다.
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

[*.md]
BasedOnStyles = Project

# docs/ 아래는 전부 영어다. 규칙은 docs/standards/writing-style.md 에 있다.
[docs/**.md]
BasedOnStyles = Project, English

# 저장소 루트 문서는 팀의 작업 언어로 쓴다. 이 스캐폴딩의 기본은 한국어다.
# CLAUDE.md 는 AGENTS.md 를 가리키는 한 줄이라 대상이 아니다.
[{AGENTS,README,SECURITY,CONTRIBUTING}.md]
BasedOnStyles = Project, Korean
